name: Image

# Builds every image in this repo. Jobs run only when their inputs changed
# (host/ or toolbox/), except on the daily schedule and manual dispatch,
# which rebuild everything so base-image updates are picked up.
#
# Tags: pushes to main publish `:main`. Pull requests publish `:pr-<n>` so a
# draft PR yields pullable images for testing before anything lands.
#
# `setup-storage` preserves the runner's container configuration, gives each
# job its own TMPDIR, and reports actual disk space. The host rechunk action
# also uses rootful storage and a fixed cache volume; use disposable runners.

on:
  schedule:
    - cron: 22 9 * * *
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # `main` on push, `pr-<n>` on pull requests, `main` on schedule/dispatch.
  TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'main' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      host: ${{ steps.filter.outputs.host == 'true' || github.event_name != 'push' && github.event_name != 'pull_request' }}
      toolbox: ${{ steps.filter.outputs.toolbox == 'true' || github.event_name != 'push' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            host:
              - 'host/**'
              - '.github/workflows/image.yml'
              - '.github/setup-storage'
            toolbox:
              - 'toolbox/**'
              - '.github/workflows/image.yml'
              - '.github/setup-storage'

  host:
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: ubuntu-24.04
    env:
      RAW_IMAGE: raw-img-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up storage
        run: .github/setup-storage

      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: 'v2.2.4'

      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          sudo env TMPDIR="$TMPDIR" buildah build --format docker --tag "$RAW_IMAGE" host/
          df -h / /var/lib/containers

      # Rechunk deletes this job's raw image after creating the OSTree commit.
      - uses: hhd-dev/rechunk@v0.8.6
        id: rechunk
        with:
          rechunk: 'ghcr.io/hhd-dev/rechunk:v0.8.6'
          ref: ${{ env.RAW_IMAGE }}
          prev-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main"
          skip_compression: true
          version: ${{ env.TAG }}

      - name: Load in podman and tag
        env:
          RECHUNK_REF: ${{ steps.rechunk.outputs.ref }}
          RECHUNK_LOCATION: ${{ steps.rechunk.outputs.location }}
        run: |
          test "$RECHUNK_LOCATION" = "$GITHUB_WORKSPACE/$RAW_IMAGE"
          IMAGE=$(podman pull "$RECHUNK_REF")
          podman tag "$IMAGE" "$IMAGE_NAME:$TAG"
          # Rechunk output can require root to remove, even after its chown.
          sudo rm -rf -- "$RECHUNK_LOCATION"
          df -h / /var/lib/containers

      - name: Push to GHCR
        uses: redhat-actions/push-to-registry@v2
        id: push
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ env.TAG }}
          extra-args: |
            --disable-content-trust

      - name: Sign image
        run: |
          cosign sign -y "$REGISTRY/$IMAGE_NAME@$DIGEST"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

  toolbox:
    needs: changes
    if: needs.changes.outputs.toolbox == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      # Variants build against exactly this image, pulled by digest.
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up storage
        run: .github/setup-storage

      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          podman build --format docker -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/toolbox:${{ env.TAG }} toolbox/

      # Prove the image is a toolbox image and that its tools run, before
      # anything is pushed.
      - name: Smoke test
        run: |
          set -eu
          img=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/toolbox:${{ env.TAG }}
          test "$(podman inspect "$img" --format '{{index .Config.Labels "com.github.containers.toolbox"}}')" = true
          podman run --rm "$img" sh -c 'rg --version && cargo --version && go version && kubectl version --client && oras version && sops --version'

      - name: Push to GHCR
        uses: redhat-actions/push-to-registry@v2
        id: push
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ env.IMAGE_NAME }}/toolbox
          tags: ${{ env.TAG }}
          extra-args: |
            --disable-content-trust

      - name: Sign image
        run: |
          cosign sign -y "$REGISTRY/$IMAGE_NAME/toolbox@$DIGEST"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

  toolbox-variant:
    needs: toolbox
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        variant: [phosh, kernel, fedpkg]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up storage
        run: .github/setup-storage

      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
        with:
          cosign-release: 'v2.2.4'

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d # v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build on the base from this run, not whatever tag is on GHCR.
      - name: Fetch base image
        run: |
          id=$(podman pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/toolbox@${{ needs.toolbox.outputs.digest }})
          podman tag "$id" localhost/workstation-toolbox:base

      - name: Build image
        run: |
          podman build --format docker \
            --build-arg BASE=localhost/workstation-toolbox:base \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/toolbox-${{ matrix.variant }}:${{ env.TAG }} \
            toolbox/${{ matrix.variant }}/

      # One command per variant that only works if its builddeps are present.
      - name: Smoke test
        run: |
          set -eu
          img=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/toolbox-${{ matrix.variant }}:${{ env.TAG }}
          test "$(podman inspect "$img" --format '{{index .Config.Labels "com.github.containers.toolbox"}}')" = true
          case ${{ matrix.variant }} in
            phosh)  podman run --rm "$img" sh -c 'pkg-config --modversion libphosh-0.45 gtk+-3.0 wlroots-0.20 && phoc --version' ;;
            kernel) podman run --rm "$img" sh -ec 'vng --version; aarch64-linux-gnu-gcc --version; aarch64-linux-musl-gcc --version' ;;
            fedpkg)
              podman run --rm "$img" sh -ec 'mock --version; rpmlint --version; fedpkg --help'
              # The CLI tries to unshare namespaces even for --debug-config.
              # Load the real configuration without demanding build privileges.
              podman run --rm "$img" python3 -c '
          from mockbuild.config import load_config
          config = load_config("/etc/mock", "fedora-45-x86_64")
          assert config["isolation"] == "simple", config["isolation"]
          print("Fedora 45 mock configuration loads; isolation=" + config["isolation"])
          '
              ;;
          esac

      - name: Push to GHCR
        uses: redhat-actions/push-to-registry@v2
        id: push
        with:
          registry: ${{ env.REGISTRY }}
          image: ${{ env.IMAGE_NAME }}/toolbox-${{ matrix.variant }}
          tags: ${{ env.TAG }}
          extra-args: |
            --disable-content-trust

      - name: Sign image
        run: |
          cosign sign -y "$REGISTRY/$IMAGE_NAME/toolbox-${{ matrix.variant }}@$DIGEST"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
