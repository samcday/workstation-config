name: Host image

# Build the host image when its inputs change.
# Weekly and manual runs rebuild it for upstream updates.
#
# Tags: pushes to main publish `:main`. Pull requests publish `:pr-<n>` so a
# draft PR yields a pullable image for testing before anything lands.
#
# `setup-storage` preserves the runner's container configuration, gives each
# job its own TMPDIR, and reports actual disk space. The rechunk action also
# uses rootful storage and a fixed cache volume; use disposable runners.

on:
  schedule:
    - cron: '22 9 * * 1'
  push:
    branches: [main]
    paths:
      - 'host/**'
      - '.github/workflows/host.yml'
      - '.github/setup-storage'
  pull_request:
    branches: [main]
    paths:
      - 'host/**'
      - '.github/workflows/host.yml'
      - '.github/setup-storage'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # `main` on push, `pr-<n>` on pull requests, `main` on schedule/dispatch.
  TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'main' }}

jobs:
  host:
    runs-on: ubuntu-24.04
    env:
      RAW_IMAGE: raw-img-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up storage
        run: .github/setup-storage

      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.2.4'

      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          sudo env TMPDIR="$TMPDIR" buildah build --format docker --tag "$RAW_IMAGE" host/
          df -h / /var/lib/containers

      # Rechunk deletes this job's raw image after creating the OSTree commit.
      - uses: hhd-dev/rechunk@5fbe1d3a639615d2548d83bc888360de6267b1a2 # v1.2.4
        id: rechunk
        with:
          rechunk: ghcr.io/hhd-dev/rechunk@sha256:8a84bd5a029681aa8db523f927b7c53b5aded9b078b81605ac0a2fedc969f528 # v1.2.4
          ref: ${{ env.RAW_IMAGE }}
          prev-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main"
          skip_compression: true
          version: ${{ env.TAG }}

      - name: Load in podman and tag
        env:
          RECHUNK_REF: ${{ steps.rechunk.outputs.ref }}
          RECHUNK_LOCATION: ${{ steps.rechunk.outputs.location }}
        run: |
          test "$RECHUNK_LOCATION" = "$GITHUB_WORKSPACE/$RAW_IMAGE"
          IMAGE=$(podman pull "$RECHUNK_REF")
          podman tag "$IMAGE" "$REGISTRY/$IMAGE_NAME:$TAG"
          # Rechunk output can require root to remove, even after its chown.
          sudo rm -rf -- "$RECHUNK_LOCATION"
          df -h / /var/lib/containers

      - name: Push to GHCR
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        id: push
        with:
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
          extra-args: |
            --disable-content-trust

      - name: Sign image
        run: |
          cosign sign -y "$REGISTRY/$IMAGE_NAME@$DIGEST"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
