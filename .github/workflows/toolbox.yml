name: Toolbox image

# Build one toolbox for general development, Phosh, kernels, and packaging.
# Weekly and manual runs pick up upstream updates.
#
# Tags: pushes to main publish `:main`. Pull requests publish `:pr-<n>` so a
# draft PR yields pullable images for testing before anything lands.
#
# `setup-storage` preserves the runner's container configuration, gives each
# job its own TMPDIR, and reports actual disk space.

on:
  schedule:
    - cron: '22 9 * * 1'
  push:
    branches: [main]
    paths:
      - 'toolbox/**'
      - '.github/workflows/toolbox.yml'
      - '.github/setup-storage'
  pull_request:
    branches: [main]
    paths:
      - 'toolbox/**'
      - '.github/workflows/toolbox.yml'
      - '.github/setup-storage'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # `main` on push, `pr-<n>` on pull requests, `main` on schedule/dispatch.
  TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'main' }}

jobs:
  toolbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up storage
        run: .github/setup-storage

      - name: Record runner capacity
        id: capacity
        run: |
          podman --version
          buildah --version
          df -h "$HOME" "$RUNNER_TEMP"
          python3 - <<'PY'
          import os, shutil
          free = shutil.disk_usage(os.environ["HOME"]).free
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"free_bytes={free}\n")
          print(f"Available CPUs: {os.cpu_count()}; initial free bytes: {free}")
          PY

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.2.4'

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        run: |
          start=$SECONDS
          /usr/bin/time -v podman build --format docker \
            -t "$REGISTRY/$IMAGE_NAME/toolbox:$TAG" toolbox/
          echo "seconds=$((SECONDS - start))" >> "$GITHUB_OUTPUT"
          podman image inspect "$REGISTRY/$IMAGE_NAME/toolbox:$TAG" > "$RUNNER_TEMP/toolbox-inspect.json"
          df -h "$HOME" "$RUNNER_TEMP"

      - name: Smoke test
        run: |
          set -eu
          img="$REGISTRY/$IMAGE_NAME/toolbox:$TAG"
          test "$(podman inspect "$img" --format '{{index .Config.Labels "com.github.containers.toolbox"}}')" = true
          podman run --rm \
            --volume "$GITHUB_WORKSPACE/toolbox/tests/smoke.sh:/tmp/smoke.sh:ro" \
            "$img" bash /tmp/smoke.sh

      - name: Test Rawhide packaging
        timeout-minutes: 20
        run: |
          # Rootless, with the namespace capabilities Mock needs in toolbox.
          # No host home, Podman store, or Podman socket is mounted.
          img="$REGISTRY/$IMAGE_NAME/toolbox:$TAG"
          podman run --rm --privileged --env FEDPKG_SMOKE_TEST=1 \
            --volume "$GITHUB_WORKSPACE/toolbox/tests/mock-build.sh:/tmp/mock-build.sh:ro" \
            "$img" bash /tmp/mock-build.sh

      - name: Push to GHCR
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        id: push
        with:
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/toolbox:${{ env.TAG }}
          extra-args: |
            --disable-content-trust

      - name: Sign image
        run: |
          cosign sign -y "$REGISTRY/$IMAGE_NAME/toolbox@$DIGEST"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Record image measurements
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          BUILD_SECONDS: ${{ steps.build.outputs.seconds }}
          INITIAL_FREE_BYTES: ${{ steps.capacity.outputs.free_bytes }}
        run: |
          ref="$REGISTRY/$IMAGE_NAME/toolbox@$DIGEST"
          skopeo inspect --raw "docker://$ref" > "$RUNNER_TEMP/toolbox-manifest.json"
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          image = json.loads((root / "toolbox-inspect.json").read_text())[0]
          manifest = json.loads((root / "toolbox-manifest.json").read_text())
          metrics = {
              "build_seconds": int(os.environ["BUILD_SECONDS"]),
              "image_bytes": image["Size"],
              "registry_layer_bytes": sum(layer["size"] for layer in manifest["layers"]),
              "layers": len(manifest["layers"]),
              "initial_free_bytes": int(os.environ["INITIAL_FREE_BYTES"]),
              "final_free_bytes": shutil.disk_usage(os.environ["HOME"]).free,
              "digest": os.environ["DIGEST"],
          }
          print(json.dumps(metrics, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## Unified toolbox measurements\n\n")
              for key, value in metrics.items():
                  summary.write(f"- {key}: `{value}`\n")
          PY
