# Toolbox: use a file ticket cache instead of KCM.
#
# toolbox writes /etc/krb5.conf.d/kcm_default_ccache (KCM) at
# container-create time, but host sssd-kcm is not reachable from inside the
# container, so kinit/kfinit fail (containers/toolbox#1734). krb5's
# includedir merge is first-read-wins (files read in sorted order, first
# definition of a key wins), so this name must sort BEFORE
# kcm_default_ccache to win; verified with klist in a test container.
[libdefaults]
default_ccache_name = FILE:/tmp/krb5cc_%{uid}